<div class="auth-page">
  <div class="auth-card">
    <h1>Sign in</h1>
    <p class="muted">Admin can edit portfolio data. Viewer can only view account info.</p>
    <form [formGroup]="form" (ngSubmit)="submit()">
      <label>
        <span>Username</span>
        <input type="text" formControlName="username" autocomplete="username" />
      </label>
      <label>
        <span>Password</span>
        <input type="password" formControlName="password" autocomplete="current-password" />
      </label>
      @if (error(); as err) {
        <p class="error">{{ err }}</p>
      }
      <button type="submit" class="btn" [disabled]="form.invalid">Sign in</button>
    </form>
    <p class="hint">Default users (change passwords in production): <code>admin</code> / <code>ChangeMe_Admin!</code> · <code>viewer</code> / <code>ChangeMe_Viewer!</code></p>
    <a routerLink="/">← Back to portfolio</a>
  </div>
</div>
